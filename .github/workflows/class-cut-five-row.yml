name: Class cuts and five-row elimination
on:
  push:
    branches: [proof/class-cut-five-row-20261030]
    paths:
      - 'LC004/**'
      - 'LC004.lean'
      - 'research/fiber_elimination_20261030/**'
      - '.github/workflows/class-cut-five-row.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ runner.os }}-lean-v4.19.0-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-v4.19.0-
      - name: Install pinned Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit
        run: |
          set -eo pipefail
          python scripts/check_lean_coverage.py
          lake exe cache get
          lake build LC004 2>&1 | tee fiber-build.log
          lake env lean scripts/AxiomAudit.lean 2>&1 | tee fiber-axiom-audit.log
          python scripts/test_verification_guards.py
          git diff --exit-code -- lake-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-cut-five-row-lean
          path: fiber-*.log
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore checksummed baseline and replay original-pattern checks
        run: |
          set -eo pipefail
          python research/fiber_elimination_20261030/restore_baseline.py
          python research/fiber_elimination_20261030/class_cut_check.py
          python research/fiber_elimination_20261030/fibers.py
          python research/fiber_elimination_20261030/mixed_certificates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-cut-five-row-exact
          path: research/fiber_elimination_20261030/*.json
