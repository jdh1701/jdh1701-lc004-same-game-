name: Cross-domain exact coefficient probes
on:
  push:
    branches: [research/cross-domain-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent coefficient probes
        run: |
          python research/cross_domain_20261029/probe.py
          python research/cross_domain_20261029/probe56.py
          python research/cross_domain_20261029/probe57.py
          python research/cross_domain_20261029/crosscheck.py
      - name: Overlap obstruction checks
        run: |
          python research/overlap_20261029/probe.py
          python research/overlap_20261029/verify.py
          python research/overlap_20261029/higher.py
          python research/overlap_20261029/probe67.py
          python research/overlap_20261029/higher67.py
          python research/overlap_20261029/verify67.py
          python research/overlap_20261029/correction.py
      - name: Hypergraph partition function and dynamics witnesses
        run: python research/physics_audit_20261029/probe.py
      - name: All-five projection and adversarial checks
        run: python research/all_five_adversarial_20261029/controls.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-domain-results
          path: |
            research/cross_domain_20261029/*.json
            research/overlap_20261029/*.json
            research/physics_audit_20261029/*.json
            research/all_five_adversarial_20261029/*.json
