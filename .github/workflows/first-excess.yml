name: First-excess support and exhaustive 556 census
on:
  push:
    branches: [proof/first-excess-20261030]
    paths:
      - 'LC004/**'
      - 'LC004.lean'
      - 'research/first_excess_20261030/**'
      - '.github/workflows/first-excess.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ runner.os }}-lean-v4.19.0-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lean-v4.19.0-
      - name: Install pinned Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit all active modules
        run: |
          set -eo pipefail
          python scripts/check_lean_coverage.py
          lake exe cache get
          lake build LC004 2>&1 | tee first-excess-build.log
          lake env lean scripts/AxiomAudit.lean 2>&1 | tee first-excess-axioms.log
          python scripts/test_verification_guards.py
          git diff --exit-code -- lake-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-excess-lean
          path: first-excess-*.log
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Two exhaustive enumerations and structural replay
        run: |
          set -eo pipefail
          python research/first_excess_20261030/prepare.py
          g++ -O3 -std=c++17 -Wall -Wextra -Werror research/first_excess_20261030/count.cpp -o /tmp/count556
          /tmp/count556 research/first_excess_20261030/tables.txt research/first_excess_20261030/nonzero.txt > research/first_excess_20261030/count.json
          python research/first_excess_20261030/independent.py
          python research/first_excess_20261030/reductions.py
          python research/first_excess_20261030/classify.py
          python research/first_excess_20261030/inflation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-excess-exact
          path: research/first_excess_20261030/
