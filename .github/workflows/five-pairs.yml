name: five-pairs
on:
  push:
    branches: [research/free-cumulants-20261029]
    paths: ['research/free_cumulants/five_pairs.cpp', '.github/workflows/five-pairs.yml']
  workflow_dispatch:
jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        r: [0]
    steps:
      - uses: actions/checkout@v4
      - run: g++ -O2 -o fp research/free_cumulants/five_pairs.cpp
      - run: |
          ./fp 10 1 0; ./fp 15 1 0
          out=$(./fp 15 1 ${{ matrix.r }})
          echo "::notice title=n25 shard ${{ matrix.r }}::$out"
