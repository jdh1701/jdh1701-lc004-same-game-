name: LC004 heavy and tool-grounded research verification
on:
  push:
    branches: [research/heavy-greedy-obstruction-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709
        with:
          auto-config: false
          build: false
          use-mathlib-cache: true
      - name: Build imported mathematical foundation
        run: lake build LC004.ExecutableUniqueness LC004.RawEncoding
      - name: Certify concrete obstruction and transitive axiom allowlist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lake/build/lib/lean/research
          lake env lean -o .lake/build/lib/lean/research/HeavyGreedyObstruction.olean research/HeavyGreedyObstruction.lean | tee research/heavy_greedy_lean_audit.log
          lake env lean research/ContinuationSummaryObstruction.lean | tee research/tool_grounded_20261029/continuation-lean.log
      - name: Independent exact searches
        run: python3 research/heavy_greedy_obstruction.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exact symbolic and constraint experiments
        run: |
          python3 -m pip install -r research/tool_grounded_20261029/requirements.txt
          python3 research/tool_grounded_20261029/residual_hankel.py
          python3 research/tool_grounded_20261029/summary_repair.py
      - name: Source-pinned official REPL and incremental proof checks
        shell: bash
        run: |
          set -euo pipefail
          python3 research/tool_grounded_20261029/bootstrap_repl.py --directory "$RUNNER_TEMP/lc004-repl"
          lake env python3 research/tool_grounded_20261029/repl_check.py --repl "$RUNNER_TEMP/lc004-repl/.lake/build/bin/repl"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: heavy-greedy-obstruction-evidence
          path: |
            research/heavy_greedy_lean_audit.log
            research/heavy_greedy_obstruction_results.json
            research/tool_grounded_20261029/*.json
            research/tool_grounded_20261029/*.log
