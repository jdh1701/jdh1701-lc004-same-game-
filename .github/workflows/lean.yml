name: Lean Proof Check
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Lean and Lake
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ runner.os }}-lean-v4.19.0-${{ hashFiles('lean-toolchain', 'lakefile.toml', 'lake-manifest.json') }}

          restore-keys: |
            ${{ runner.os }}-lean-v4.19.0-

      - name: Install Lean
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check all active modules are in the build closure
        run: python scripts/check_lean_coverage.py

      - name: Restore pinned dependencies and mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get
          git diff --exit-code -- lake-manifest.json

      - name: Build LC004
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          set -o pipefail
          lake build 2>&1 | tee lean-build.log
          git diff --exit-code -- lake-manifest.json

      - name: Enforce the project axiom allowlist
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          set -o pipefail
          lake env lean scripts/AxiomAudit.lean 2>&1 | tee axiom-audit.log

      - name: Validate direct grammar counting against Same Game
        run: |
          python research/validate_direct_grammar_dfa.py
          python -c "import sys;sys.path.insert(0,'research');from direct_grammar_dfa import compute as direct;from orbit_grammar_dfa import compute as orbit;[(lambda a,b: (_ for _ in ()).throw(AssertionError((q,n,a,b))) if a!=b else print('ORBIT CHECK PASS',q,n,a))(direct(q,n)[0],orbit(q,n)[0]) for q,n in [(2,8),(3,10),(3,12),(3,14),(4,8)]]"

      - name: Validate symbolic restricted-growth polynomial counts
        run: |
          python research/check_rgs_symbolic_count.py

      - name: Verify second-diagonal combinatorial conjecture
        run: |
          python research/second_diagonal_formula_check.py
          python research/second_diagonal_independent_n16.py

      - name: Test four-block matching overlap criterion
        run: python research/overlap_criterion_test.py

      - name: Check proposed refined partition degree encoding
        run: python research/check_partition_degree_encoding.py

      - name: Preserve verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-logs
          path: |
            lean-build.log
            axiom-audit.log
            lake-manifest.json
