name: Alexandria publication and Lean Blueprint
on:
  push:
    branches:
      - publication/alexandria-blueprint-20261029
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alexandria-publication-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact publication source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build pinned Lean project
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709
        with:
          build: true
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install document and graph dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz libgraphviz-dev latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-dejavu-core dvisvgm
          python -m pip install -r publication/requirements.txt
      - name: Source, axiom, and declaration gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_lean_coverage.py
          lake env lean scripts/FaceAxiomAudit.lean | tee face-axiom-audit.log
          python publication/validate_blueprint.py --self-test
          lake env lean publication/BlueprintDeclAudit.lean | tee blueprint-declaration-audit.log
      - name: Exact finite cross-checks
        run: |
          python research/rigid_face_geometry_check.py
          python research/heavy_face_assembly_check.py
      - name: Compile manuscript and interactive Blueprint
        shell: bash
        run: |
          set -euo pipefail
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -cd publication/paper.tex
          leanblueprint web
          python publication/build_site.py
      - name: Preserve publication artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: alexandria-publication
          path: |
            publication/paper.pdf
            publication/paper.log
            publication/Alexandria_Omega_Publication_Sources.zip
            _site/publication-manifest.json
            face-axiom-audit.log
            blueprint-declaration-audit.log
      - name: Upload Pages bundle
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy checked publication
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
