name: repo-checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Provenance (carried-over files unchanged)
        run: python3 scripts/check_provenance.py
      - name: Lean coverage and source guard
        run: python3 scripts/check_lean_coverage.py > /dev/null && echo ok
      - name: Research index covers every research folder
        run: |
          for d in research/*/; do n=$(basename "$d"); grep -q "\`$n\`" docs/RESEARCH_INDEX.md || { echo "missing from index: $n"; exit 1; }; done
          echo "index ok"
      - name: Fixed-content counts (3,3,r) and binary H1 replay
        run: |
          python3 -I research/fixed_content_333_20261117/fixed_content_333.py 11 40 | diff research/fixed_content_333_20261117/results.json -
          python3 -I research/fixed_content_333_20261117/binary_content.py 7 | diff research/fixed_content_333_20261117/binary_results.json -
      - name: All-alphabet transfer (W_n(q), n <= 20) replay
        run: python3 -I research/all_alphabets_20261118/all_alphabets.py | diff research/all_alphabets_20261118/results.json -
