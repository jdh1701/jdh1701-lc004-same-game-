name: LC004 geometric heavy-face verification
on:
  push:
    branches:
      - proof/rigid-face-geometry-20261029
    paths:
      - 'LC004/**'
      - 'LC004.lean'
      - 'research/rigid_face_geometry_check.py'
      - 'scripts/FaceAxiomAudit.lean'
      - '.github/workflows/rigid-face-geometry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - name: Check source coverage and transitive axioms
        run: |
          set -o pipefail
          python scripts/check_lean_coverage.py
          lake env lean scripts/FaceAxiomAudit.lean 2>&1 | tee face-axiom-audit.log
      - name: Independent maximal-run, certificate, and face tests
        run: python research/rigid_face_geometry_check.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometric-face-evidence
          path: |
            face-axiom-audit.log
            research/rigid_face_geometry_results.json
